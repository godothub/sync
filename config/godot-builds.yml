name: Sync Snapshot

env:
  SOURCE_GITHUB_REPO: godotengine/godot-builds
  TARGET_ATOMGIT_REPO: godothub/godot-builds
  MAX_SYNC_FILES: 100
  START_RELEASE_TAG: '4.7-stable'
  SKIP_RELEASES_BEFORE_START: true
  SYNC_BRANCHES: true
  SYNC_TAGS: true
  SYNC_RELEASES: true

triggers:
  schedule: true
  schedule_cron:
    - '0 16 * * *'
  workflow_dispatch: true
