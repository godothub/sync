name: Sync Gode

env:
  SOURCE_GITHUB_REPO: godothub/gode
  TARGET_ATOMGIT_REPO: godothub/gode
  MAX_SYNC_FILES: 100
  START_RELEASE_TAG: ''
  SKIP_RELEASES_BEFORE_START: false
  SYNC_BRANCHES: true
  SYNC_TAGS: true
  SYNC_RELEASES: true

triggers:
  schedule: true
  schedule_cron:
    - '0 16 * * *'
  workflow_dispatch: true
